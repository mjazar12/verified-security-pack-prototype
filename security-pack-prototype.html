<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified Security Pack — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:        #f6f1e8;
    --paper-2:      #efe7d6;
    --paper-3:      #e6dcc6;
    --ink:          #1f1b16;
    --ink-2:        #3a342b;
    --ink-3:        #6b6359;
    --ink-4:        #9a9285;
    --rule:         #2a251e;
    --accent:       oklch(70% 0.14 55);
    --accent-ink:   oklch(40% 0.10 55);
    --accent-soft:  oklch(92% 0.04 55);
    --warn:         oklch(60% 0.16 30);
    --warn-soft:    oklch(94% 0.05 30);
    --good:         oklch(55% 0.13 150);
    --good-soft:    oklch(94% 0.04 150);
    --shadow:       0 1px 0 rgba(0,0,0,.05), 0 6px 20px -10px rgba(0,0,0,.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper-2);
    color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,.025) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,.03) 0%, transparent 45%);
    padding: 32px 24px 80px;
  }

  .hand { font-family: 'Caveat', cursive; font-weight: 600; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .annotation {
    position: absolute;
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--accent-ink);
    line-height: 1.1;
    pointer-events: none;
    z-index: 50;
  }
  .annotation::before {
    content: "";
    position: absolute;
    border-top: 1.5px dashed var(--accent-ink);
    width: 40px;
    transform-origin: left center;
  }
  .annotation.left::before  { right: 100%; top: 50%; }
  .annotation.right::before { left: 100%; top: 50%; transform: rotate(0); }
  .annotation.top::before   { top: 100%; left: 20px; transform: rotate(90deg); height: 0; width: 30px; }

  .stage {
    max-width: 1280px;
    margin: 0 auto;
  }

  .stage-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 20px;
    padding: 0 8px;
  }
  .stage-title {
    font-family: 'Caveat', cursive;
    font-size: 38px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.5px;
  }
  .stage-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 6px;
  }
  .stage-meta {
    font-size: 11px;
    color: var(--ink-3);
    text-align: right;
    line-height: 1.6;
  }
  .stage-meta b { color: var(--ink); font-weight: 600; }
  .stage-meta .pill {
    display: inline-block;
    border: 1.5px solid var(--ink);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    margin-left: 4px;
    background: var(--paper);
  }

  /* macOS window chrome */
  .window {
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    position: relative;
  }
  .titlebar {
    height: 36px;
    background: var(--paper-3);
    border-bottom: 1.5px solid var(--rule);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
  }
  .traffic { display: flex; gap: 6px; }
  .traffic span {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.3);
    background: var(--paper);
  }
  .traffic span:nth-child(1) { background: #ff5f57; border-color: #e0443e; }
  .traffic span:nth-child(2) { background: #febc2e; border-color: #d4a012; }
  .traffic span:nth-child(3) { background: #28c840; border-color: #1aab29; }
  .titlebar-title {
    flex: 1; text-align: center;
    font-size: 11px; color: var(--ink-3);
    letter-spacing: 0.5px;
  }
  .titlebar-right { display: flex; gap: 10px; font-size: 11px; color: var(--ink-3); }

  /* Desktop App layout */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 720px;
  }
  .sidebar {
    background: var(--paper-2);
    border-right: 1.5px solid var(--rule);
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-4);
    padding: 12px 10px 4px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .1s;
  }
  .nav-item .ico {
    width: 14px; height: 14px;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    flex-shrink: 0;
    position: relative;
  }
  .nav-item.active {
    background: var(--paper);
    border-color: var(--rule);
    color: var(--ink);
    font-weight: 500;
  }
  .nav-item .ico.code::after {
    content: "</>";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 700;
  }
  .nav-item .ico.chat::after  { content: "…"; position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; font-size: 14px; }
  .nav-item .ico.cowork::after{ content: "▤"; position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; font-size: 9px; }
  .nav-item .ico.settings { border-radius: 50%; }
  .nav-item .ico.settings::after { content: "⚙"; position: absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 10px; border: none; }

  .project-card {
    margin: 0 4px 8px;
    padding: 10px;
    background: var(--paper);
    border: 1.5px dashed var(--rule);
    border-radius: 6px;
    font-size: 11px;
  }
  .project-card .label {
    font-size: 9px; text-transform: uppercase;
    color: var(--ink-3); letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .project-card .name { font-weight: 600; color: var(--ink); }
  .project-card .branch { color: var(--ink-3); font-size: 10px; margin-top: 2px; }

  .pack-status {
    margin: 8px 4px 0;
    padding: 8px 10px;
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    font-size: 10px;
    background: var(--paper);
    transition: all .2s;
  }
  .pack-status.on   { border-color: var(--accent-ink); background: var(--accent-soft); }
  .pack-status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ink-4);
    margin-right: 6px;
    vertical-align: middle;
    transition: background .2s;
  }
  .pack-status.on .dot { background: var(--accent-ink); box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 3px var(--accent-ink); }
  .pack-status .lbl { font-size: 9px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1px; }
  .pack-status .name { font-weight: 600; color: var(--ink); font-size: 11px; }
  .pack-status .meta { color: var(--ink-3); font-size: 10px; margin-top: 4px; }

  /* main canvas */
  .canvas {
    background: var(--paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .canvas-header {
    padding: 12px 18px;
    border-bottom: 1.5px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper);
  }
  .breadcrumb {
    font-size: 11px;
    color: var(--ink-3);
    flex: 1;
  }
  .breadcrumb b { color: var(--ink); font-weight: 600; }
  .crumb-sep { margin: 0 6px; color: var(--ink-4); }

  .header-actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    color: var(--ink);
    cursor: pointer;
    line-height: 1.4;
    transition: background .1s;
  }
  .btn:hover { background: var(--paper-3); }
  .btn.primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn.primary:hover { background: var(--ink-2); }
  .btn.accent {
    background: var(--accent-ink);
    border-color: var(--accent-ink);
    color: var(--paper);
  }
  .btn.accent:hover { filter: brightness(1.15); }
  .btn.warn {
    background: var(--warn);
    border-color: var(--warn);
    color: white;
  }
  .btn.warn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-3); }
  .btn.ghost:hover { color: var(--ink); }
  .btn.small { padding: 4px 8px; font-size: 10px; }

  /* canvas body */
  .canvas-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    overflow: hidden;
  }
  .pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pane + .pane { border-left: 1.5px solid var(--rule); }
  .pane-header {
    padding: 8px 14px;
    border-bottom: 1.5px dashed var(--rule);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper-2);
  }
  .pane-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  /* chat messages */
  .msg {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    background: var(--paper);
    font-size: 12px;
    line-height: 1.5;
  }
  .msg.user {
    background: var(--paper-3);
    margin-left: 24px;
  }
  .msg.agent { margin-right: 24px; }
  .msg .who {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-3);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .msg .who .pack-tag {
    background: var(--accent-soft);
    color: var(--accent-ink);
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
  }

  /* banner */
  .banner {
    margin: 14px 16px 0;
    padding: 14px;
    border: 1.5px solid var(--accent-ink);
    background: var(--accent-soft);
    border-radius: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    position: relative;
  }
  .banner .icon-shield {
    width: 28px; height: 32px;
    border: 1.5px solid var(--accent-ink);
    border-radius: 4px 4px 50% 50%/4px 4px 30% 30%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--accent-ink);
  }
  .banner .body { flex: 1; }
  .banner .title-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .banner .title-row b { font-size: 12px; color: var(--ink); }
  .banner .title-row .badge {
    font-size: 9px;
    background: var(--paper);
    border: 1px solid var(--accent-ink);
    color: var(--accent-ink);
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .banner .desc {
    font-size: 11px;
    color: var(--ink-2);
    margin-bottom: 10px;
  }
  .banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .banner .dismiss {
    position: absolute;
    top: 8px; right: 10px;
    background: transparent;
    border: none;
    color: var(--ink-3);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
  }
  .banner .dismiss:hover { color: var(--ink); }

  /* check items */
  .checklist { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .check {
    display: flex;
    gap: 10px;
    padding: 8px 10px;
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    background: var(--paper);
    font-size: 11px;
    align-items: flex-start;
  }
  .check .box {
    width: 14px; height: 14px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    line-height: 1;
  }
  .check .box.done { background: var(--ink); color: var(--paper); }
  .check .box.done::after { content: "✓"; font-weight: 700; }
  .check .box.run  { background: var(--accent-soft); border-color: var(--accent-ink); color: var(--accent-ink); }
  .check .box.run::after  { content: "•"; font-size: 18px; line-height: 0; }
  .check .box.gate { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .check .box.gate::after { content: "!"; font-weight: 700; }
  .check .lbl { flex: 1; }
  .check .lbl .ttl { font-weight: 500; color: var(--ink); }
  .check .lbl .sub { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
  .check .tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: var(--paper-3);
    color: var(--ink-3);
    flex-shrink: 0;
  }

  /* plan mode header strip */
  .plan-strip {
    margin: 12px 16px 0;
    padding: 10px 14px;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    background: var(--paper-2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    transition: all .2s;
  }
  .plan-strip.active {
    border-color: var(--accent-ink);
    background: var(--accent-soft);
  }
  .plan-strip .left { display: flex; align-items: center; gap: 10px; }
  .plan-strip .left .indicator {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--ink-4);
    transition: background .2s;
  }
  .plan-strip.active .indicator { background: var(--accent-ink); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 var(--accent-ink); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }
  .plan-strip .label { font-weight: 600; color: var(--ink); }
  .plan-strip .meta  { color: var(--ink-3); font-size: 10px; }

  /* code / diff display */
  .file {
    margin-top: 12px;
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
  }
  .file:first-child { margin-top: 0; }
  .file-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: var(--paper-3);
    border-bottom: 1.5px solid var(--rule);
    font-size: 10px;
    color: var(--ink-2);
    gap: 8px;
  }
  .file-head .name { font-weight: 600; color: var(--ink); }
  .file-head .meta { color: var(--ink-3); font-size: 10px; flex-shrink: 0; }
  .diff { padding: 0; font-size: 11px; }
  .diff .row {
    display: grid;
    grid-template-columns: 30px 14px 1fr;
    gap: 6px;
    padding: 1px 8px;
    line-height: 1.55;
  }
  .diff .row.add { background: var(--good-soft); }
  .diff .row.del { background: var(--warn-soft); text-decoration: line-through; text-decoration-color: rgba(0,0,0,.25); }
  .diff .row.ctx { background: transparent; color: var(--ink-3); }
  .diff .row .ln { color: var(--ink-4); text-align: right; user-select: none; }
  .diff .row .sign { color: var(--ink-3); font-weight: 700; }
  .diff .row.add .sign { color: var(--good); }
  .diff .row.del .sign { color: var(--warn); }
  .diff .row .code { color: var(--ink); font-size: 11px; white-space: pre; }

  /* rationale */
  .rationale {
    margin: 0;
    padding: 8px 12px 10px;
    background: var(--accent-soft);
    border-top: 1.5px dashed var(--accent-ink);
    font-size: 11px;
    color: var(--accent-ink);
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .rationale .tag {
    font-size: 9px;
    background: var(--accent-ink);
    color: var(--paper);
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 1px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .rationale .txt { color: var(--ink-2); }
  .rationale .txt b { color: var(--ink); }

  /* approval gate */
  .gate-overlay {
    position: absolute;
    inset: 0;
    background: rgba(31,27,22,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    backdrop-filter: blur(2px);
  }
  .gate-modal {
    background: var(--paper);
    border: 1.5px solid var(--warn);
    border-radius: 12px;
    width: 460px;
    max-width: 92%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    overflow: hidden;
    animation: modal-in .2s cubic-bezier(.3,.7,.4,1);
  }
  @keyframes modal-in {
    from { transform: translateY(10px) scale(.97); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .gate-head {
    background: var(--warn-soft);
    border-bottom: 1.5px solid var(--warn);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .gate-head .icon-warn {
    width: 22px; height: 22px;
    border: 1.5px solid var(--warn);
    border-radius: 50%;
    color: var(--warn);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .gate-head .ttl { font-weight: 600; color: var(--ink); font-size: 12px; }
  .gate-head .sub { font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1.5px; }
  .gate-body {
    padding: 16px 18px;
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .gate-body .stmt {
    background: var(--paper-2);
    border-left: 3px solid var(--warn);
    padding: 8px 12px;
    margin: 10px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
  }
  .gate-foot {
    padding: 12px 18px;
    border-top: 1.5px dashed var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--paper-2);
  }
  .gate-foot .meta { font-size: 10px; color: var(--ink-3); }

  /* view checks modal */
  .vc-overlay {
    position: absolute;
    inset: 0;
    background: rgba(31,27,22,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 25;
    padding: 24px;
  }
  .vc-modal {
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    width: 720px;
    max-width: 100%;
    max-height: 90%;
    box-shadow: 0 30px 80px rgba(0,0,0,.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: modal-in .2s cubic-bezier(.3,.7,.4,1);
  }
  .vc-head {
    padding: 16px 20px;
    border-bottom: 1.5px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background: var(--paper-3);
  }
  .vc-head .ttl { font-weight: 600; font-size: 14px; color: var(--ink); }
  .vc-head .sub { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-3); margin-top: 2px; }
  .vc-body {
    padding: 18px 20px;
    overflow-y: auto;
    flex: 1;
  }
  .vc-section { margin-bottom: 18px; }
  .vc-section h4 {
    margin: 0 0 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .vc-section h4 .ct {
    background: var(--paper-3);
    color: var(--ink-2);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9px;
  }
  .vc-foot {
    padding: 14px 20px;
    border-top: 1.5px solid var(--rule);

  select.twk-field{padding-right:22px;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ right: 16, bottom: 52 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      right: Math.min(maxRight, Math.max(PAD, offsetRef.current.right)),
      bottom: Math.min(maxBottom, Math.max(PAD, offsetRef.current.bottom)),
    };
    panel.style.right = offsetRef.current.right + 'px';
    panel.style.bottom = offsetRef.current.bottom + 'px';
  }, []);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e.data?.type === '__deactivate_edit_mode') setOpen(false);
      else if (e.data?.type === '__toggle_tweaks') setOpen(v => !v);
    };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);

  React.useEffect(() => {
    if (open) clampToViewport();
  }, [open, clampToViewport]);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right;
    const sb = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        right: sr - (ev.clientX - sx),
        bottom: sb - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.right, bottom: offsetRef.current.bottom }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

      {children}
    </>

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
         className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
      <div className="twk-seg-thumb"
           style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
      {opts.map((o) => (
        <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
      ))}
    </div>
  );
}

function TweakSelect({ value, options, onChange }) {
  return (
    <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
      {options.map((o) => {
        const v = typeof o === 'object' ? o.value : o;
        const l = typeof o === 'object' ? o.label : o;
        return <option key={v} value={v}>{l}</option>;
      })}
    </select>
  );
}

// ── Right pane ────────────────────────────────────────────────────────────────

function DiffView({ packOn, stage }) {
  if (stage === 'validation') {
    const lines = [
      ['ctx', 1, '',  "import { db } from \"../db\";"],
      ['add', 2, '+', "import { z } from \"zod\";"],
      ['ctx', 3, '',  ""],
      ['add', 4, '+', "const RefreshBody = z.object({"],
      ['add', 5, '+', "  token: z.string().min(32).max(512),"],
      ['add', 6, '+', "  device_id: z.string().uuid().optional(),"],
      ['add', 7, '+', "});"],
      ['ctx', 8, '',  ""],
      ['ctx', 9, '',  "export async function refresh(req, res) {"],
      ['del',10, '−', "  const { token } = req.body;"],
      ['add',10, '+', "  const parsed = RefreshBody.safeParse(req.body);"],
      ['add',11, '+', "  if (!parsed.success) return res.status(400).json({error: \"bad_request\"});"],
      ['add',12, '+', "  const { token } = parsed.data;"],
      ['ctx',13, '',  ""],
    ];
    const accessLines = [
      ['ctx',  1, '',  "export async function grantRefreshScope(user, scope) {"],
      ['del',  2, '−', "  if (user.role) return true; // any authenticated user"],
      ['add',  2, '+', "  const ADMIN_SCOPES = new Set([\"admin:refresh\", \"admin:*\"]);"],
      ['add',  3, '+', "  if (!user || !user.role) return false;"],
      ['add',  4, '+', "  if (scope.startsWith(\"admin:\") && !ADMIN_SCOPES.has(user.role)) {"],
      ['add',  5, '+', "    audit.log(\"access_denied\", { user: user.id, scope });"],
      ['add',  6, '+', "    return false;"],
      ['add',  7, '+', "  }"],
      ['add',  8, '+', "  return true;"],
      ['ctx',  9, '',  "}"],
    ];
    return (
      <>
        <div className="file">
          <div className="file-head">
            <span className="name">src/auth/refresh.ts</span>
            <span className="meta">+12 −2 · proposed</span>
          </div>
          <div className="diff">
            {lines.map(([t, n, s, c], i) => (
              <div key={i} className={`row ${t}`}>
                <span className="ln">{n}</span>
                <span className="sign">{s}</span>
                <span className="code">{c}</span>
              </div>
            ))}
          </div>
          {packOn && (
            <div className="rationale">
              <span className="tag">Why</span>
              <div className="txt">
                <b>OWASP A03 — Injection.</b> The legacy handler accepted any string from <span className="mono">req.body.token</span>. Adding a strict zod schema constrains length, type, and shape before the value reaches the DB layer. Returns <span className="mono">400</span> on malformed input rather than letting it propagate.
              </div>
            </div>
          )}
        </div>

        <div className="file">
          <div className="file-head">
            <span className="name">src/auth/access.ts</span>
            <span className="meta">+7 −1 · proposed</span>
          </div>
          <div className="diff">
            {accessLines.map(([t, n, s, c], i) => (
              <div key={i} className={`row ${t}`}>
                <span className="ln">{n}</span>
                <span className="sign">{s}</span>
                <span className="code">{c}</span>
              </div>
            ))}
          </div>
          {packOn && (
            <div className="rationale">
              <span className="tag">Why</span>
              <div className="txt">
                <b>OWASP A01 — Broken Access Control.</b> Added explicit role verification before granting admin refresh scope. The previous check passed any authenticated user; the new gate restricts <span className="mono">admin:*</span> scopes and logs every denial to the audit trail.
              </div>
            </div>
          )}
        </div>
      </>
    );
  }

  if (stage === 'drop') {
    const lines = [
      ['add', 1, '+', "-- Backfill verified: 487/487 records migrated."],
      ['add', 2, '+', "-- Snapshot: snap_84a2 (retained 30d)."],
      ['add', 3, '+', "BEGIN;"],
      ['add', 4, '+', "DROP TABLE IF EXISTS auth_tokens_v1;"],
      ['add', 5, '+', "COMMIT;"],
    ];
    return (
      <div className="file">
        <div className="file-head">
          <span className="name">db/migrations/2026_05_drop_auth_tokens_v1.sql</span>
          <span className="meta">new file · 6 lines</span>
        </div>
        <div className="diff">
          {lines.map(([t, n, s, c], i) => (
            <div key={i} className={`row ${t}`}>
              <span className="ln">{n}</span>
              <span className="sign">{s}</span>
              <span className="code">{c}</span>
            </div>
          ))}
        </div>
        {packOn && (
          <div className="rationale">
            <span className="tag">Gate</span>
            <div className="txt">
              <b>Destructive DB operation.</b> Pack policy requires human-in-the-loop confirmation for any <span className="mono">DROP</span>, <span className="mono">TRUNCATE</span>, or schema-altering migration. Checkpoint rollback cannot restore dropped tables — only the snapshot can.
            </div>
          </div>
        )}
      </div>
    );
  }

  // final / PR
  return (
    <div className="file">
      <div className="file-head">
        <span className="name">PR #412 · feat(auth): refresh tokens via auth_sessions</span>
        <span className="meta">4 files · +87 −62 · ✓ green</span>
      </div>
      <div style={{padding:14, fontSize:11, color:'var(--ink-2)'}}>
        <div style={{fontSize:10, textTransform:'uppercase', letterSpacing:1.5, color:'var(--ink-3)', marginBottom:6}}>Files changed</div>
        <ul style={{margin:0, paddingLeft:18, lineHeight:1.7}}>
          <li><span className="mono">src/auth/refresh.ts</span> · +28 −18</li>
          <li><span className="mono">src/auth/access.ts</span> · +14 −9</li>
          <li><span className="mono">db/migrations/2026_05_*.sql</span> · +6 −0</li>
          <li><span className="mono">tests/auth.test.ts</span> · +39 −35</li>
        </ul>
        {packOn && (
          <>
            <div style={{fontSize:10, textTransform:'uppercase', letterSpacing:1.5, color:'var(--accent-ink)', margin:'14px 0 6px'}}>Pack-attached findings</div>
            <ul style={{margin:0, paddingLeft:18, lineHeight:1.7}}>
              <li>0 new vulnerabilities introduced (Semgrep + CodeQL)</li>
              <li>0 secrets in diff</li>
              <li>1 destructive action gated · approved by you</li>
              <li>3 OWASP categories addressed: A01, A03, A07</li>
            </ul>
          </>
        )}
      </div>
    </div>
  );
}

// ── Annotations ───────────────────────────────────────────────────────────────

  const notes = [];
  if (step === 1 && arm === 'T1') {
    notes.push({ top: 235, left: -160, w: 150, text: "T1: feature finds the user. ↗ One-click activation surface." });
    notes.push({ top: 380, right: -180, w: 170, text: "Detection signals shown ↗ inside the prompt — no hidden setup." });
  }
  if (step === 1 && arm === 'T2') {
    notes.push({ top: 200, left: -180, w: 170, text: "T2: same Pack, ↗ buried in Settings. Tests whether activation surface itself drives lift." });
  }
  if (step === 1 && arm === 'C') {
    notes.push({ top: 280, left: -170, w: 160, text: "Control: power-user setup. ↗ This is where average users get the generic experience." });
  }
  if (step === 2) {
    notes.push({ top: 220, right: -180, w: 170, text: "↖ Disclaimer is mandatory. \"Verified ≠ guaranteed.\" Risk #1 mitigation." });
    notes.push({ top: 480, left: -160, w: 150, text: "Tools, gates, ↘ blocks are visible BEFORE enabling — trust through transparency." });
  }
  if (step === 3) {
    notes.push({ top: 180, left: -180, w: 170, text: "Plan Mode now ↘ security-aware. Pack skills loaded as context." });
    notes.push({ top: 320, right: -180, w: 170, text: "↖ Pack-scoped tool list — narrower than default surface. Blast-radius mitigation." });
  }
  if (step === 4) {
    notes.push({ top: 380, right: -190, w: 180, text: "Per-edit security rationale ↖ — directly maps eval metric \"correctness w/ explanation.\"" });
  }
  if (step === 5) {
    notes.push({ top: 280, left: -180, w: 170, text: "Hard gate. ↗ Checkpoint can't undo a DROP. Approval logged for audit." });
  }
  if (step === 6) {
    notes.push({ top: 380, right: -190, w: 180, text: "↖ Pack-attached findings on PR — a shareable artifact. Drives team-wide standardization." });
  }
  return (
    <>
      {notes.map((n, i) => (
        <div key={i} className="annotation"
          style={{
            top: n.top,
            left: n.left !== undefined ? n.left : undefined,
            right: n.right !== undefined ? n.right : undefined,
            width: n.w,
            transform: `rotate(${(i % 2 === 0 ? -1 : 1) * 1.2}deg)`,
          }}>
          {n.text}
        </div>
      ))}
    </>
  );
}

// ── Tweaks content ────────────────────────────────────────────────────────────
function PrototypeTweaks({ t, setT }) {
  return (
    <TweaksPanel title="Tweaks · Prototype">
      <TweakSection title="Experiment arm">
        <TweakRadio
          value={t.arm}
          onChange={(v) => setT('arm', v)}
          options={[
            { value: 'C',  label: 'Control' },
            { value: 'T1', label: 'T1 · auto' },
            { value: 'T2', label: 'T2 · settings' },
          ]}
        />
        <div style={{fontSize:10, color:'rgba(41,38,27,.5)', marginTop:6, lineHeight:1.4}}>
          T1 vs T2 isolates whether the auto-presented banner adds lift independent of the Pack contents.
        </div>
      </TweakSection>
      <TweakSection title="Scenario step">
        <TweakSelect
          value={String(t.step)}
          onChange={(v) => setT('step', parseInt(v, 10))}
          options={STEP_LABELS.map((l, i) => ({ value: String(i + 1), label: `${i + 1} · ${l}` }))}
        />
      </TweakSection>
      <TweakSection title="Grader annotations">
        <TweakToggle
          label="Hand-drawn margin notes"
          value={t.showAnnotations}
          onChange={(v) => setT('showAnnotations', v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const [showVC, setShowVC] = useState(false);
  const [packOn, setPackOn] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [gateOpen, setGateOpen] = useState(false);
  const [overrideDismissed, setOverrideDismissed] = useState(false);

  const arm = t.arm;
  const step = t.step;

  useEffect(() => {
    if (arm === 'C') setPackOn(false);
    else if (step >= 3) setPackOn(true);
    else setPackOn(false);
  }, [arm, step]);

  useEffect(() => {
    setGateOpen(step === 5 && packOn);
  }, [step, packOn]);

  useEffect(() => {
    if (arm === 'T2' && step === 1) setShowSettings(true);
    else setShowSettings(false);
  }, [arm, step]);

  useEffect(() => {
    setShowVC(step === 2);
  }, [step]);

  // Reset the override-dismissal when leaving step 4 so the warning re-appears next time.
  useEffect(() => { if (step !== 4 && step !== 6) setOverrideDismissed(false); }, [step]);

  function jumpStep(n) { setT('step', n); }

  // Checkpoint count derived from progress. Pack-aware (no checkpoints in control arm).
  const checkpoints = React.useMemo(() => {
    if (arm === 'C' || step < 3) return { count: 0, latest: null };
    const elapsed = ['just now', '2m ago', '5m ago', '8m ago'];
    const count = Math.min(4, step - 2);
    return { count, latest: elapsed[count - 1] };
  }, [arm, step]);

  // Keyboard navigation: ←/→ steps, 1/2/3 arms, T toggles tweaks panel.
  useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowLeft')  { jumpStep(Math.max(1, step - 1)); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { jumpStep(Math.min(6, step + 1)); e.preventDefault(); }
      else if (e.key === '1') { setT('arm', 'C');  e.preventDefault(); }
      else if (e.key === '2') { setT('arm', 'T1'); e.preventDefault(); }
      else if (e.key === '3') { setT('arm', 'T2'); e.preventDefault(); }
      else if (e.key === 't' || e.key === 'T') {
        window.dispatchEvent(new MessageEvent('message', { data: { type: '__toggle_tweaks' } }));
        e.preventDefault();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [step, setT]);

  return (
    <div className="stage">
      <div className="stage-header">
        <div>
          <div className="stage-title">Verified Security Pack — Prototype</div>
          <div className="stage-sub">Wireframe v1.0 · Claude Code Desktop App · MGMT 275 Final</div>
        </div>
        <div className="stage-meta">
          <div><b>Scenario</b>: refresh-token refactor before release</div>
          <div>
            <b>Arm</b>:
            <span className="pill">
              {arm === 'C' ? 'Control' : arm === 'T1' ? 'T1 · auto-presented' : 'T2 · settings-buried'}
            </span>
          </div>
          <div><b>Step</b>: {step}/6 · {STEP_LABELS[step - 1]}</div>
        </div>
      </div>

      <div className="window" style={{position:'relative'}}>
        <div className="titlebar">
          <div className="traffic"><span /><span /><span /></div>
          <div className="titlebar-title">Claude Code · payments-api</div>
          <div className="titlebar-right">
            <span>⎇ feat/auth-refresh-tokens</span>
            <span>·</span>
            <span>Sonnet 4.6</span>
          </div>
        </div>

        <div className="app">
          <Sidebar
            packState={packOn ? 'on' : 'off'}
            arm={arm}
            onOpenSettings={() => arm === 'T2' && jumpStep(1)}
            checkpoints={checkpoints}
          />
          <div className="canvas">
            {!showSettings ? (
              <>
                <CanvasHeader packOn={packOn} arm={arm} />
                <div className="canvas-body">
                  <LeftPane
                    arm={arm} step={step} packOn={packOn}
                    onView={() => jumpStep(2)}
                    onEnable={() => jumpStep(3)}
                    onDismiss={() => {}}
                    overrideDismissed={overrideDismissed}
                    onOverrideDismiss={() => setOverrideDismissed(true)}
                  />
                  <RightPane step={step} packOn={packOn} />
                </div>
              </>
            ) : (
              <>
                <CanvasHeader packOn={packOn} arm={arm} />
                <SettingsPage onEnable={() => jumpStep(3)} packOn={packOn} />
              </>
            )}
          </div>
        </div>

        {showVC && <ViewChecksModal onClose={() => jumpStep(1)} onEnable={() => jumpStep(3)} />}
        {gateOpen && <ApprovalGate onApprove={() => jumpStep(6)} onReject={() => jumpStep(6)} />}
        {t.showAnnotations && <Annotations arm={arm} step={step} />}
      </div>

      {/* Scenario stepper */}
      <div className="scenario-bar">
        <div style={{display:'flex', gap:14, alignItems:'center'}}>
          <span style={{fontSize:10, textTransform:'uppercase', letterSpacing:1.5, color:'var(--ink-3)'}}>Arm</span>
          <div className="arm-pills">
            <button className={arm === 'C'  ? 'active' : ''} onClick={() => setT('arm', 'C')}>Control</button>
            <button className={arm === 'T1' ? 'active' : ''} onClick={() => setT('arm', 'T1')}>T1 · auto</button>
            <button className={arm === 'T2' ? 'active' : ''} onClick={() => setT('arm', 'T2')}>T2 · settings</button>
          </div>
        </div>

        <div className="step-stack">
          <span className="label">Step</span>
          <div className="step-dots">
            {STEP_LABELS.map((l, i) => (
              <div key={i}
                className={`step-dot ${step === i + 1 ? 'active' : step > i + 1 ? 'done' : ''}`}
                title={l}
                onClick={() => jumpStep(i + 1)}>
                {i + 1}
              </div>
            ))}
          </div>
          <span style={{minWidth:90, fontSize:10, color:'var(--ink-3)', textAlign:'right'}}>{STEP_LABELS[step - 1]}</span>
        </div>

        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <button className="btn small" onClick={() => jumpStep(Math.max(1, step - 1))}>← Prev</button>
          <button className="btn small primary" onClick={() => jumpStep(Math.min(6, step + 1))}>Next →</button>
          <button className="btn small ghost"
            title="Open Tweaks panel (or press T)"
            onClick={() => window.dispatchEvent(new MessageEvent('message', { data: { type: '__toggle_tweaks' } }))}>
            ⚙ Tweaks
          </button>
          <span className="kbd-hint">
            <kbd>←</kbd><kbd>→</kbd> steps · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> arms · <kbd>T</kbd> tweaks
          </span>
        </div>
      </div>

      {/* Legend */}
      <div className="legend">
        <div className="item">
          <div className="swatch accent" />
          <div><b>Pack-active surface.</b> Anywhere the warm accent appears, the Verified Security Pack is shaping behavior.</div>
        </div>
        <div className="item">
          <div className="swatch warn" />
          <div><b>Approval gate.</b> Destructive actions (DROP, schema, access-control) require explicit human-in-the-loop confirmation.</div>
        </div>
        <div className="item">
          <div className="swatch dash" />
          <div><b>Wireframe fidelity.</b> Lo-fi to keep critique on flow and information architecture, not visual polish.</div>
        </div>
        <div className="item">
          <div className="swatch" style={{background:'var(--paper-2)'}} />
          <div><b>Tweaks panel.</b> Toggle experiment arm and walk through steps to compare flows side-by-side.</div>
        </div>
      </div>

      <div className="stage-footer">
        <div>Mazen Azar · Craig Bennett · MGMT 275 Product Delivery · Final Project · May 2026</div>
        <div>Claude Code Desktop App · Verified Security Pack · v1.0 wireframe</div>
      </div>

      <PrototypeTweaks t={t} setT={setT} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
